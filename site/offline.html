<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline — Dot Trading Post</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F3EAD3">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F3EAD3; color:#121212; font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:420px; background:#FFFCF4; border:3px solid #121212; border-radius:12px; padding:26px 22px; box-shadow:6px 6px 0 #121212; display:grid; gap:12px; }
  img { width:48px; height:48px; }
  h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
  p { margin:0; color:#4a4a4a; }
  p[lang] { font-size:14px; }
  a { justify-self:start; margin-top:6px; background:#FFD23F; color:#121212; border:3px solid #121212; border-radius:999px; padding:12px 22px; font-weight:700; text-decoration:none; box-shadow:3px 3px 0 #121212; }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>You're offline</h1>
  <p>The board needs a connection. Your listings and trades are safe; they'll be here when you're back.</p>
  <p lang="es">Sin conexión. Tus anuncios e intercambios están a salvo.</p>
  <p lang="pt-BR">Sem conexão. Seus anúncios e trocas estão seguros.</p>
  <p lang="ja">オフラインです。出品と取引はそのまま残っています。</p>
  <a href="/app">Try again</a>
</main>
</body>
</html>
